name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quick:
    name: Static, unit and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: node --test tools/qa-real-users/*.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Validate API image
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  browser:
    name: Source browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: source-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  integration:
    name: Database and built browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:start
      - run: pnpm supabase:check
      - name: Verify seeded messaging
        run: docker exec -i supabase_db_meet-people psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/integration/sql/seed-messaging.sql
      - name: Verify SQL security contracts
        run: docker exec -i supabase_db_meet-people psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/integration/sql/hosted-services.sql
      - run: pnpm env:local
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      # Deployment checks leave the verified normal frontend in dist/web.
      - run: pnpm test:deployment
      - run: pnpm build:api
      - name: Browser tests against verified production-mode artifacts
        run: sh scripts/test-built.sh --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  check:
    # Preserve the branch-protection context: Checks / CI.
    name: CI
    needs: [quick, browser, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every CI lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs = JSON.parse(process.env.RESULTS); if (!Object.values(jobs).every(job => job.result === "success")) process.exit(1)'
