name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quick:
    name: Static, unit and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: docker/setup-buildx-action@v4
      - name: Validate API image
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  browser:
    name: Source browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser --workers=4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: source-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  integration:
    name: Database and built browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  check:
    # Preserve the branch-protection context: Checks / CI.
    name: CI
    needs: [quick, browser, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every CI lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs = JSON.parse(process.env.RESULTS); if (!Object.values(jobs).every(job => job.result === "success")) process.exit(1)'
