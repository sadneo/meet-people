name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
      EVENT_GROUP_WORKER_ENABLED: ${{ vars.EVENT_GROUP_WORKER_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release belongs to a version tag
        run: |
          git tag --points-at "$RELEASE_SHA" --list 'v*' | python3 -c 'import sys; assert sys.stdin.read().strip(), "No version tag points at the checked commit"'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Verify API contracts
        run: pnpm exec vitest run tests/unit/api.test.ts
      - name: Validate deployment settings
        run: |
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${SUPABASE_PROJECT_REF:?Missing SUPABASE_PROJECT_REF}"
          : "${SUPABASE_URL:?Missing VITE_SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing VITE_SUPABASE_PUBLISHABLE_KEY}"
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN}"
      - name: Validate GitHub release identity
        env:
          OIDC_AUDIENCE: https://iam.googleapis.com/${{ vars.GCP_WIF_PROVIDER }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.set('audience', process.env.OIDC_AUDIENCE)
          const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
          assert.equal(response.status, 200, 'GitHub OIDC token request failed')
          const { value } = await response.json()
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString())
          const { repository_id, ref, environment, workflow_ref } = claims
          console.log(JSON.stringify({ repository_id, ref, environment, workflow_ref }))
          assert.equal(String(repository_id), process.env.GITHUB_REPOSITORY_ID)
          assert.ok(ref.startsWith('refs/tags/v'), 'Only version tags can deploy')
          assert.equal(environment, 'production')
          JS
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
      - name: Link production database through its session pooler
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --linked --dry-run
      - name: Build immutable API image
        run: |
          IMAGE="us-east4-docker.pkg.dev/$GCP_PROJECT_ID/${{ vars.GAR_REPOSITORY }}/pebble-api:$RELEASE_SHA"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" --project="$GCP_PROJECT_ID" --format='value(image_summary.digest)')
          echo "API_IMAGE=${IMAGE%:*}@$DIGEST" >> "$GITHUB_ENV"
      - run: pnpm build:web
      - name: Deploy authenticated Edge Functions
        run: |
          pnpm exec supabase functions deploy embed-interest --project-ref "$SUPABASE_PROJECT_REF" --use-api
          pnpm exec supabase functions deploy ingest-sbengaged --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - run: pnpm exec supabase db push --linked --yes
      - name: Install canonical product backend
        run: node scripts/deploy-product-schema.mjs
      - run: pnpm hosting:configure
      - run: sh scripts/deploy-api.sh
      - name: Deploy event worker job (no execution)
        run: sh scripts/deploy-worker.sh
      - name: Deploy web and pin API revision
        run: pnpm dlx firebase-tools@15.28.2 deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
      - name: Verify production release
        run: pnpm test:hosted "https://${{ vars.FIREBASE_HOSTING_SITE_ID }}.web.app"
      - name: Release summary
        run: |
          MIGRATION=$(node --input-type=module -e 'import { readdirSync } from "node:fs"; console.log(readdirSync("supabase/migrations").filter(name => name.endsWith(".sql")).sort().at(-1))')
          {
            echo "### Production release"
            echo "- URL: https://${{ vars.FIREBASE_HOSTING_SITE_ID }}.web.app"
            echo "- Commit: $RELEASE_SHA"
            echo "- Image: $API_IMAGE"
            echo "- Worker: pebble-event-group-worker (enabled=$EVENT_GROUP_WORKER_ENABLED; not executed or scheduled)"
            echo "- Latest migration: $MIGRATION"
          } >> "$GITHUB_STEP_SUMMARY"
