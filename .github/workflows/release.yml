name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment destination
        type: choice
        options: [sandbox, production]
        default: sandbox
      source_ref:
        description: 'Sandbox: dev or its full SHA (default latest dev). Production: full SHA already on main.'
        type: string
        default: ''

permissions:
  contents: read

# Tests run on PRs into dev; releases deploy already-reviewed commits without re-running them.
# Queue complete production pipelines in release order. Sandbox runs lock only their deploy job.
concurrency:
  group: release-${{ ((github.event_name == 'push' && github.ref_name == 'main') || inputs.environment == 'production') && 'production' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      branch: ${{ steps.source.outputs.branch }}
      environment: ${{ steps.source.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve and validate deployment source
        id: source
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node scripts/resolve-deployment.mjs

  prepare:
    name: Prepare ${{ needs.resolve.outputs.environment }}
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prepare.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_branch: ${{ needs.resolve.outputs.branch }}
      environment: ${{ needs.resolve.outputs.environment }}

  deploy:
    needs: [resolve, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-east4' }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      API_RUNTIME_ACCOUNT: ${{ vars.API_RUNTIME_ACCOUNT }}
      API_SECRET: ${{ vars.API_SECRET }}
      WORKER_JOB: ${{ vars.WORKER_JOB }}
      WORKER_RUNTIME_ACCOUNT: ${{ vars.WORKER_RUNTIME_ACCOUNT }}
      FIREBASE_WEB_SITE_ID: ${{ vars.FIREBASE_WEB_SITE_ID }}
      FIREBASE_MOBILE_SITE_ID: ${{ vars.FIREBASE_MOBILE_SITE_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      API_IMAGE: ${{ needs.prepare.outputs.image }}
      VITE_BUILD_SHA: ${{ needs.resolve.outputs.sha }}
      VITE_BUILD_BRANCH: ${{ needs.resolve.outputs.branch }}
      HOSTED_CONFIG_WORKDIR: hosting/deployment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate isolated deployment settings
        run: node scripts/configure-deployment.mjs
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Download this run's prepared frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-${{ needs.resolve.outputs.environment }}-${{ needs.resolve.outputs.sha }}
          path: dist
      - name: Require a prepared immutable image
        run: test -n "$API_IMAGE" && test "${API_IMAGE#*@sha256:}" != "$API_IMAGE"
      - name: Check production recovery policy before changes
        if: env.DEPLOY_ENVIRONMENT == 'production'
        env:
          # Operator accepted Free-plan recovery risk for early access (2026-11-13).
          # Change to require-managed-backup before leaving early access.
          PRODUCTION_RECOVERY_POLICY: early-access-no-backups
        run: node scripts/check-production-recovery.mjs
      - name: Link database and preview migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          node scripts/push-reviewed-migrations.mjs --dry-run
      # Steps for each stage live in scripts/deploy-stages.mjs; add backend features there.
      - name: Deploy backend (Edge Functions, migrations, schema, hosted config, event sync)
        run: node scripts/deploy-stages.mjs backend
      - name: Deploy services (API, workers, schedules)
        run: node scripts/deploy-stages.mjs services
      # Each site's pinTag updates the shared Run service; publish sequentially.
      - name: Deploy web site and pin API revision
        run: pnpm dlx firebase-tools@15.28.2 deploy --config firebase.deploy.json --only "hosting:$FIREBASE_WEB_SITE_ID" --project "$GCP_PROJECT_ID" --non-interactive
      - name: Deploy mobile site and pin API revision
        run: pnpm dlx firebase-tools@15.28.2 deploy --config firebase.deploy.json --only "hosting:$FIREBASE_MOBILE_SITE_ID" --project "$GCP_PROJECT_ID" --non-interactive
      - name: Verify every deployed site and custom domain
        run: |
          web_urls=("https://$FIREBASE_WEB_SITE_ID.web.app")
          mobile_urls=("https://$FIREBASE_MOBILE_SITE_ID.web.app")
          if [ "$DEPLOY_ENVIRONMENT" = sandbox ]; then
            web_urls+=(https://web.dev.pebble.garden)
            mobile_urls+=(https://mobile.dev.pebble.garden)
          else
            web_urls+=(https://pebble.garden)
            mobile_urls+=(https://mobile.pebble.garden)
          fi
          status=0
          for url in "${web_urls[@]}"; do
            HOSTED_PRODUCT=web pnpm test:hosted "$url" || status=1
          done
          for url in "${mobile_urls[@]}"; do
            HOSTED_PRODUCT=mobile pnpm test:hosted "$url" || status=1
          done
          exit "$status"
      - name: Deployment summary
        if: always()
        env:
          SOURCE_BRANCH: ${{ needs.resolve.outputs.branch }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const e = process.env
          const lines = [`### ${e.DEPLOY_ENVIRONMENT} deployment: ${e.DEPLOY_RESULT}`, `- Actor: ${e.GITHUB_ACTOR}`, `- Branch: ${e.SOURCE_BRANCH}`, `- Commit: ${e.RELEASE_SHA}`, `- Web site: https://${e.FIREBASE_WEB_SITE_ID}.web.app`, `- Image: ${e.API_IMAGE || 'not built'}`, '- Workers: push dispatcher (every minute), event groups (every 2 minutes)']
          lines.push(`- Mobile site: https://${e.FIREBASE_MOBILE_SITE_ID}.web.app`)
          lines.push(`- Custom domains: ${e.DEPLOY_ENVIRONMENT === 'sandbox' ? 'https://web.dev.pebble.garden, https://mobile.dev.pebble.garden' : 'https://pebble.garden, https://mobile.pebble.garden'}`)
          appendFileSync(e.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n')
          JS
