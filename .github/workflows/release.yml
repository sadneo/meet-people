name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment destination
        type: choice
        options: [sandbox, production]
        default: sandbox
      source_ref:
        description: 'Sandbox: dev or its full SHA (default latest dev). Production: full SHA already on main.'
        type: string
        default: ''
      skip_checks:
        description: Skip pre-deployment checks (requires override reason)
        type: boolean
        default: false
      override_reason:
        description: Reason for bypassing checks
        type: string
        default: ''

permissions:
  contents: read

# Queue complete production pipelines, preserving release order even if CI times vary.
# Dev runs have independent groups; only their environment-changing job is locked.
concurrency:
  group: release-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || inputs.environment == 'production') && 'production' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      branch: ${{ steps.source.outputs.branch }}
      environment: ${{ steps.source.outputs.environment }}
      skip_checks: ${{ steps.source.outputs.skip_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and validate deployment source
        id: source
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: node scripts/resolve-deployment.mjs

  checks:
    name: Checks
    needs: resolve
    if: needs.resolve.outputs.skip_checks != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  prepare-dev:
    name: Prepare sandbox
    needs: resolve
    if: needs.resolve.outputs.environment == 'sandbox'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prepare.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_branch: ${{ needs.resolve.outputs.branch }}
      environment: sandbox

  prepare-production:
    name: Prepare production
    needs: [resolve, checks]
    if: >-
      always() && !cancelled() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.environment == 'production' &&
      (needs.checks.result == 'success' ||
       (needs.resolve.outputs.skip_checks == 'true' && needs.checks.result == 'skipped'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prepare.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_branch: ${{ needs.resolve.outputs.branch }}
      environment: production

  deploy:
    needs: [resolve, checks, prepare-dev, prepare-production]
    if: >-
      always() && !cancelled() && needs.resolve.result == 'success' &&
      (needs.checks.result == 'success' ||
       (needs.resolve.outputs.skip_checks == 'true' && needs.checks.result == 'skipped')) &&
      (needs.prepare-dev.result == 'success' || needs.prepare-production.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-east4' }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      API_RUNTIME_ACCOUNT: ${{ vars.API_RUNTIME_ACCOUNT }}
      API_SECRET: ${{ vars.API_SECRET }}
      WORKER_JOB: ${{ vars.WORKER_JOB }}
      WORKER_RUNTIME_ACCOUNT: ${{ vars.WORKER_RUNTIME_ACCOUNT }}
      FIREBASE_HOSTING_SITE_ID: ${{ vars.FIREBASE_HOSTING_SITE_ID }}
      FIREBASE_DEVTOOLS_SITE_ID: ${{ vars.FIREBASE_DEVTOOLS_SITE_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      API_IMAGE: ${{ needs.prepare-dev.outputs.image || needs.prepare-production.outputs.image }}
      VITE_BUILD_SHA: ${{ needs.resolve.outputs.sha }}
      VITE_BUILD_BRANCH: ${{ needs.resolve.outputs.branch }}
      EVENT_GROUP_WORKER_ENABLED: 'false'
      HOSTED_CONFIG_WORKDIR: hosting/deployment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reject superseded automatic sandbox releases before making changes
        run: node scripts/resolve-deployment.mjs --check-current
      - run: pnpm install --frozen-lockfile
      - name: Validate isolated deployment settings
        run: node scripts/configure-deployment.mjs
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Download this run's prepared frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ needs.resolve.outputs.environment }}-${{ needs.resolve.outputs.sha }}
          path: dist
      - name: Require a prepared immutable image
        run: test -n "$API_IMAGE" && test "${API_IMAGE#*@sha256:}" != "$API_IMAGE"
      - name: Link database and preview migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --linked --dry-run
      - name: Deploy authenticated Edge Functions
        run: |
          pnpm exec supabase functions deploy embed-interest --project-ref "$SUPABASE_PROJECT_REF" --use-api
          pnpm exec supabase functions deploy ingest-sbengaged --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - run: pnpm exec supabase db push --linked --yes
      - name: Install canonical product backend
        run: node scripts/deploy-product-schema.mjs
      - run: pnpm hosting:configure
      - run: sh scripts/deploy-api.sh
      - name: Deploy disabled event worker (no execution or schedule)
        run: sh scripts/deploy-worker.sh
      # Each site's pinTag updates the shared Run service; publish sequentially.
      - name: Deploy normal site and pin API revision
        run: pnpm dlx firebase-tools@15.28.2 deploy --config firebase.deploy.json --only "hosting:$FIREBASE_HOSTING_SITE_ID" --project "$GCP_PROJECT_ID" --non-interactive
      - name: Deploy developer site and pin API revision
        if: env.DEPLOY_ENVIRONMENT == 'sandbox'
        run: pnpm dlx firebase-tools@15.28.2 deploy --config firebase.deploy.json --only "hosting:$FIREBASE_DEVTOOLS_SITE_ID" --project "$GCP_PROJECT_ID" --non-interactive
      - name: Verify every deployed site and custom domain
        run: |
          urls=("https://$FIREBASE_HOSTING_SITE_ID.web.app")
          if [ "$DEPLOY_ENVIRONMENT" = sandbox ]; then
            urls+=("https://$FIREBASE_DEVTOOLS_SITE_ID.web.app" https://web.dev.pebble.garden https://mobile.dev.pebble.garden)
          else
            urls+=(https://pebble.garden)
          fi
          status=0
          for url in "${urls[@]}"; do
            pnpm test:hosted "$url" || status=1
          done
          exit "$status"
      - name: Deployment summary
        if: always()
        env:
          SOURCE_BRANCH: ${{ needs.resolve.outputs.branch }}
          SKIPPED_CHECKS: ${{ needs.resolve.outputs.skip_checks }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const e = process.env
          const lines = [`### ${e.DEPLOY_ENVIRONMENT} deployment: ${e.DEPLOY_RESULT}`, `- Actor: ${e.GITHUB_ACTOR}`, `- Branch: ${e.SOURCE_BRANCH}`, `- Commit: ${e.RELEASE_SHA}`, `- Checks skipped: ${e.SKIPPED_CHECKS}`, `- Override reason: ${JSON.stringify(e.OVERRIDE_REASON || '')}`, `- Site: https://${e.FIREBASE_HOSTING_SITE_ID}.web.app`, `- Image: ${e.API_IMAGE || 'not built'}`, '- Worker: disabled; not executed or scheduled']
          if (e.DEPLOY_ENVIRONMENT === 'sandbox') lines.push(`- Developer site: https://${e.FIREBASE_DEVTOOLS_SITE_ID}.web.app`)
          lines.push(`- Custom domains: ${e.DEPLOY_ENVIRONMENT === 'sandbox' ? 'https://web.dev.pebble.garden, https://mobile.dev.pebble.garden' : 'https://pebble.garden'}`)
          appendFileSync(e.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n')
          JS
